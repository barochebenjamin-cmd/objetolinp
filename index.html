<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carte Participative HD</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; z-index: 1; background: #e2e8f0; }
    .custom-pin { background: none; border: none; }
    .leaflet-tile { filter: contrast(105%) brightness(98%); }
  </style>
</head>
<body class="relative bg-slate-900 select-none">

  <!-- Carte HD -->
  <div id="map"></div>

  <!-- Bandeau affiché uniquement si la page est intégrée dans une iframe
       (ex: Google Sites) : le GPS y est bloqué par le navigateur, donc on
       propose d'ouvrir la carte en plein écran, hors iframe. -->
  <div id="iframe-warning" class="hidden absolute top-0 left-0 right-0 z-[1500] bg-amber-500 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between gap-2">
    <span>📍 Le GPS ne fonctionne pas dans cet aperçu intégré.</span>
    <a id="fullscreen-link" href="#" target="_blank" class="underline whitespace-nowrap">Ouvrir en plein écran →</a>
  </div>

  <!-- Barre d'outils supérieure -->
  <div class="absolute top-3 left-3 right-3 z-[1000] flex flex-wrap gap-2 justify-between items-center pointer-events-none">
    <div class="pointer-events-auto bg-white/95 backdrop-blur-md px-3.5 py-1.5 rounded-2xl shadow-lg border border-slate-200/60 text-xs font-semibold text-slate-800 flex items-center gap-2.5">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
      <span id="items-count">Connexion au réseau...</span>
    </div>

    <div class="pointer-events-auto flex items-center gap-2">
      <button onclick="toggleTimeline()" id="btn-timeline" class="bg-white/95 backdrop-blur-md hover:bg-slate-100 text-slate-800 px-3 py-2 rounded-2xl shadow-lg border border-slate-200/60 text-xs font-bold flex items-center gap-1.5 transition active:scale-95" title="Historique temporel">
        ⏳ <span class="hidden sm:inline">Évolution</span>
      </button>

      <button onclick="toggleAdminModal()" id="btn-admin" class="bg-white/95 backdrop-blur-md hover:bg-slate-100 text-slate-800 px-3 py-2 rounded-2xl shadow-lg border border-slate-200/60 text-xs font-bold flex items-center gap-1.5 transition active:scale-95">
        <span id="admin-icon">🔒</span> <span id="admin-label" class="hidden sm:inline">Admin</span>
      </button>

      <button onclick="fetchPins()" class="bg-white/95 backdrop-blur-md hover:bg-slate-100 text-slate-800 p-2 rounded-2xl shadow-lg border border-slate-200/60 text-xs font-bold transition active:scale-95" title="Rafraîchir les données">
        🔄
      </button>
    </div>
  </div>

  <!-- Lecteur d'Évolution Temporelle -->
  <div id="timeline-panel" class="hidden absolute top-16 left-3 right-3 z-[1000] bg-white/95 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-slate-200/80 max-w-lg mx-auto transition-all">
    <div class="flex justify-between items-center mb-2">
      <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
        <span>📈 Évolution des dépôts</span>
        <span id="timeline-date-display" class="font-normal text-slate-500 text-[11px]">(Tous les éléments)</span>
      </div>
      <button onclick="togglePlayTimeline()" id="timeline-play-btn" class="text-xs font-bold bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded-lg transition">
        ▶ Lecture
      </button>
    </div>
    <input type="range" id="timeline-slider" min="0" max="100" value="100" class="w-full accent-blue-600 cursor-pointer" oninput="onTimelineChange(this.value)">
  </div>

  <!-- Commandes d'action en bas -->
  <div class="absolute bottom-6 left-3 right-3 z-[1000] flex justify-between items-end pointer-events-none">
    <button onclick="locateUser(true)" class="pointer-events-auto w-12 h-12 bg-white text-slate-800 shadow-xl rounded-2xl flex items-center justify-center text-xl hover:bg-slate-50 border border-slate-200/60 active:scale-95 transition" title="Recentrer sur ma position">
      🎯
    </button>

    <button onclick="openFormAtUserLocation()" class="pointer-events-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-5 rounded-2xl shadow-xl shadow-blue-600/30 flex items-center gap-2 active:scale-95 transition">
      <span class="text-lg">📷</span>
      <span class="text-sm">Pinner un objet</span>
    </button>
  </div>

  <!-- Toast de notification -->
  <div id="toast" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-[1001] bg-slate-900/95 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl transition"></div>

  <!-- MODAL : Signalement public -->
  <div id="signal-modal" class="hidden fixed inset-0 z-[2000] bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
        <h3 class="font-bold text-slate-800 text-base">Signaler un objet trouvé</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">✕</button>
      </div>

      <form id="signal-form" onsubmit="submitForm(event)" class="space-y-3.5">
        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <p class="text-[11px] text-slate-400 font-mono" id="coords-text">Position : --</p>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Photo *</label>
          <input type="file" id="photo-input" accept="image/*" capture="environment" required class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
          <div id="preview-container" class="mt-2 hidden">
            <img id="image-preview" src="" alt="Aperçu" class="h-32 w-full object-cover rounded-xl border border-slate-200">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Description / Précision</label>
          <textarea id="desc-input" rows="2" maxlength="280" placeholder="Ex: Vélo d'enfant rouge, carton de vaisselle..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 text-sm transition disabled:opacity-50">
          Ajouter sur la carte
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL : Authentification Administrateur -->
  <div id="admin-modal" class="hidden fixed inset-0 z-[2000] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2">🔑</div>
        <h3 class="font-bold text-slate-800 text-base">Espace Administrateur</h3>
        <p class="text-xs text-slate-500">Gérez les statuts et supprimez des marqueurs.</p>
      </div>
      <div id="admin-login-view" class="space-y-3">
        <input type="password" id="admin-pass" placeholder="Mot de passe" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button onclick="loginAdmin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs transition">
          Se connecter
        </button>
      </div>
      <div id="admin-logged-view" class="hidden space-y-3 text-center">
        <p class="text-xs text-emerald-600 font-semibold">✓ Mode administrateur actif</p>
        <button onclick="logoutAdmin()" class="w-full bg-rose-50 text-rose-600 font-bold py-2.5 rounded-xl text-xs hover:bg-rose-100 transition">
          Déconnexion
        </button>
      </div>
      <button onclick="toggleAdminModal()" class="w-full text-slate-400 text-xs hover:text-slate-600 pt-1">Fermer</button>
    </div>
  </div>

  <script>
    // URL DE TON GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6y0RK965ypZp_CGhoMEZHWZOEtnipAR_05zVRvetz6j0Szcx9IF45z0BMoBPmyBD2/exec";

    // URL PUBLIQUE de CETTE page HTML une fois hébergée (ex: GitHub Pages,
    // Netlify...). Laisse vide tant que tu n'as pas encore hébergé le fichier
    // ailleurs que dans Google Sites — le bandeau ne s'affichera pas dans ce cas.
    const FULLSCREEN_URL = ""; // ex: "https://tonpseudo.github.io/carte/carte_participative.html"

    function checkIfEmbedded() {
      const isEmbedded = window.self !== window.top;
      if (isEmbedded && FULLSCREEN_URL) {
        document.getElementById('fullscreen-link').href = FULLSCREEN_URL;
        document.getElementById('iframe-warning').classList.remove('hidden');
      }
    }

    // Le mot de passe n'est plus vérifié ici : il est simplement transmis au
    // serveur, qui le compare à la valeur stockée dans les "Script Properties"
    // (voir Code.gs). Le stocker en clair dans le JS ne protège RIEN si le
    // serveur ne vérifie pas — c'était le vrai trou de sécurité du code initial.
    let adminPasswordEntered = null;

    let map;
    let markersLayer;
    let userMarker = null;
    let userAccuracyCircle = null;
    let userCoords = null;
    let compressedPhotoBase64 = null;

    let allItems = [];
    let isAdmin = false;
    let playInterval = null;

    // --- 0. UTILITAIRES ---
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // --- 1. INITIALISATION DE LA CARTE ---
    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        maxZoom: 20
      }).setView([46.6, 2.2], 6);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB & OpenStreetMap',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      map.on('click', (e) => {
        openModal(e.latlng.lat, e.latlng.lng);
      });

      setTimeout(() => map.invalidateSize(), 300);
      window.addEventListener('resize', () => map.invalidateSize());

      locateUser(false);
      fetchPins();
    }

    // --- 2. GÉOLOCALISATION ---
    function locateUser(center = true) {
      if (!navigator.geolocation) {
        showToast("GPS non supporté par ce navigateur.");
        return;
      }

      showToast("Positionnement GPS...");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const accuracy = pos.coords.accuracy;

          if (!userAccuracyCircle) {
            userAccuracyCircle = L.circle([userCoords.lat, userCoords.lng], {
              radius: accuracy,
              color: '#3b82f6',
              weight: 1,
              fillColor: '#60a5fa',
              fillOpacity: 0.15
            }).addTo(map);
          } else {
            userAccuracyCircle.setLatLng([userCoords.lat, userCoords.lng]).setRadius(accuracy);
          }

          if (!userMarker) {
            const userIcon = L.divIcon({
              className: 'custom-pin',
              html: `<div class="w-4 h-4 bg-blue-600 rounded-full border-2 border-white shadow-lg ring-4 ring-blue-500/30"></div>`,
              iconSize: [16, 16],
              iconAnchor: [8, 8]
            });
            userMarker = L.marker([userCoords.lat, userCoords.lng], { icon: userIcon }).addTo(map);
          } else {
            userMarker.setLatLng([userCoords.lat, userCoords.lng]);
          }

          if (center) {
            map.setView([userCoords.lat, userCoords.lng], 17);
            showToast("Position trouvée !");
          }
        },
        (err) => {
          console.warn("GPS refusé ou bloqué :", err);
          showToast("GPS bloqué : cliquez directement sur la carte pour pinner.");
        },
        { enableHighAccuracy: true, timeout: 9000, maximumAge: 10000 }
      );
    }

    function openFormAtUserLocation() {
      if (userCoords) {
        openModal(userCoords.lat, userCoords.lng);
      } else {
        showToast("Recherche de la position...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            openModal(userCoords.lat, userCoords.lng);
          },
          () => {
            showToast("Position indisponible : touchez la carte pour placer le point.");
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      }
    }

    // --- 3. SYNCHRONISATION DES SIGNALEMENTS ---
    async function fetchPins() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        allItems = await res.json();

        allItems.sort((a, b) => new Date(a.date) - new Date(b.date));

        renderPins(allItems);
        document.getElementById('items-count').innerText = `${allItems.length} trouvaille(s)`;
      } catch (err) {
        console.error(err);
        document.getElementById('items-count').innerText = "Erreur de synchronisation";
      }
    }

    function renderPins(itemsToDisplay) {
      markersLayer.clearLayers();

      itemsToDisplay.forEach(item => {
        const isCollected = item.status === "collected";
        const iconColor = isCollected ? "bg-emerald-500" : "bg-blue-600";
        const emoji = isCollected ? "✓" : "📦";

        const icon = L.divIcon({
          className: 'custom-pin',
          html: `<div class="w-8 h-8 ${iconColor} text-white rounded-full border-2 border-white shadow-md flex items-center justify-center text-xs font-bold -translate-x-1/2 -translate-y-1/2">${emoji}</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker([item.lat, item.lng], { icon });
        const dateStr = item.date ? new Date(item.date).toLocaleDateString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
        const safeId = escapeHtml(item.id);
        const safeDesc = escapeHtml(item.desc);

        let popupHtml = `
          <div class="p-1 min-w-[210px] text-slate-800">
            ${item.photoUrl ? `<img src="${escapeHtml(item.photoUrl)}" class="w-full h-32 object-cover rounded-xl mb-2 shadow-sm" loading="lazy" />` : ''}
            <div class="flex items-center justify-between gap-1 mb-1">
              <span class="text-[10px] uppercase tracking-wider font-bold px-1.5 py-0.5 rounded ${isCollected ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">
                ${isCollected ? 'Récupéré' : 'Disponible'}
              </span>
              <span class="text-[10px] text-slate-400">${dateStr}</span>
            </div>
            <p class="text-xs font-medium text-slate-700 mb-2">${safeDesc}</p>
        `;

        if (isAdmin) {
          popupHtml += `
            <div class="border-t border-slate-100 pt-2 grid grid-cols-2 gap-1.5">
              <button onclick="adminToggleStatus('${safeId}', '${item.status}')" class="py-1 px-2 rounded-lg text-[10px] font-bold ${isCollected ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">
                ${isCollected ? 'Remettre en attente' : 'Marquer pris'}
              </button>
              <button onclick="adminDeleteItem('${safeId}')" class="py-1 px-2 rounded-lg text-[10px] font-bold bg-rose-50 text-rose-600 hover:bg-rose-100">
                Supprimer
              </button>
            </div>
          `;
        }

        popupHtml += `</div>`;
        marker.bindPopup(popupHtml);
        markersLayer.addLayer(marker);
      });
    }

    // --- 4. COMPRESSION D'IMAGE ET FORMULAIRE ---
    document.getElementById('photo-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 850;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }

          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          compressedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          document.getElementById('image-preview').src = compressedPhotoBase64;
          document.getElementById('preview-container').classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Publication en cours...";

      const payload = {
        action: "add",
        lat: parseFloat(document.getElementById('lat').value),
        lng: parseFloat(document.getElementById('lng').value),
        desc: document.getElementById('desc-input').value.trim(),
        imageBase64: compressedPhotoBase64
      };

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status !== "success") throw new Error(json.message || "Échec inconnu");

        showToast("Objet épinglé avec succès !");
        closeModal();
        setTimeout(fetchPins, 1200);
      } catch (err) {
        console.error(err);
        showToast("Erreur lors de l'enregistrement.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Ajouter sur la carte";
      }
    }

    // --- 5. OUTIL D'ÉVOLUTION TEMPORELLE ---
    function toggleTimeline() {
      const p = document.getElementById('timeline-panel');
      p.classList.toggle('hidden');
      if (!p.classList.contains('hidden')) {
        document.getElementById('timeline-slider').value = 100;
        onTimelineChange(100);
      }
    }

    function onTimelineChange(val) {
      val = Number(val);
      if (allItems.length === 0) return;
      const count = Math.ceil((val / 100) * allItems.length);
      const filtered = allItems.slice(0, count);
      renderPins(filtered);

      const last = filtered[filtered.length - 1];
      if (last && val < 100) {
        const d = new Date(last.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        document.getElementById('timeline-date-display').innerText = `Jusqu'au ${d}`;
      } else {
        document.getElementById('timeline-date-display').innerText = "(Tous les dépôts)";
      }
    }

    function togglePlayTimeline() {
      const btn = document.getElementById('timeline-play-btn');
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        btn.innerText = "▶ Lecture";
      } else {
        btn.innerText = "⏸ Pause";
        let slider = document.getElementById('timeline-slider');
        slider.value = 5;
        onTimelineChange(5);

        playInterval = setInterval(() => {
          let curr = parseInt(slider.value) + 5;
          if (curr > 100) {
            clearInterval(playInterval);
            playInterval = null;
            btn.innerText = "▶ Lecture";
            slider.value = 100;
          } else {
            slider.value = curr;
          }
          onTimelineChange(slider.value);
        }, 500);
      }
    }

    // --- 6. GESTION DU COMPTE ADMINISTRATEUR ---
    // Le mot de passe saisi est envoyé au serveur à chaque action sensible
    // (delete / toggleStatus) et vérifié là-bas. Ça reste un modèle simple
    // (pas de vrai compte / session), mais ça empêche au moins un tiers
    // d'appeler l'API directement sans le mot de passe.
    function toggleAdminModal() {
      document.getElementById('admin-modal').classList.toggle('hidden');
    }

    async function loginAdmin() {
      const p = document.getElementById('admin-pass').value;
      if (!p) return;

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "checkAdmin", adminPassword: p })
        });
        const json = await res.json();

        if (json.status === "success") {
          isAdmin = true;
          adminPasswordEntered = p;
          document.getElementById('admin-login-view').classList.add('hidden');
          document.getElementById('admin-logged-view').classList.remove('hidden');
          document.getElementById('admin-icon').innerText = "🔓";
          document.getElementById('admin-label').innerText = "Admin (Actif)";
          showToast("Mode administrateur activé.");
          renderPins(allItems);
          toggleAdminModal();
        } else {
          alert("Mot de passe administrateur incorrect.");
        }
      } catch (err) {
        alert("Impossible de vérifier le mot de passe (connexion).");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      adminPasswordEntered = null;
      document.getElementById('admin-login-view').classList.remove('hidden');
      document.getElementById('admin-logged-view').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
      document.getElementById('admin-icon').innerText = "🔒";
      document.getElementById('admin-label').innerText = "Admin";
      renderPins(allItems);
      toggleAdminModal();
      showToast("Déconnexion réussie.");
    }

    async function adminDeleteItem(id) {
      if (!confirm("Confirmer la suppression définitive de cet objet ?")) return;
      map.closePopup();
      showToast("Suppression en cours...");

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "delete", id, adminPassword: adminPasswordEntered })
        });
        const json = await res.json();
        if (json.status !== "deleted") throw new Error(json.message || "Refusé");

        allItems = allItems.filter(i => i.id !== id);
        renderPins(allItems);
        showToast("Objet supprimé.");
      } catch (e) {
        console.error(e);
        showToast("Erreur de suppression (droits admin ?).");
      }
    }

    async function adminToggleStatus(id, currentStatus) {
      const newStatus = currentStatus === "collected" ? "pending" : "collected";
      map.closePopup();

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "toggleStatus", id, status: newStatus, adminPassword: adminPasswordEntered })
        });
        const json = await res.json();
        if (json.status !== "updated") throw new Error(json.message || "Refusé");

        const target = allItems.find(i => i.id === id);
        if (target) target.status = newStatus;
        renderPins(allItems);
        showToast("Statut mis à jour !");
      } catch (e) {
        console.error(e);
        showToast("Erreur lors de la mise à jour (droits admin ?).");
      }
    }

    // --- 7. MODAL HELPERS ---
    function openModal(lat, lng) {
      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;
      document.getElementById('coords-text').innerText = `Coords : ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById('signal-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('signal-modal').classList.add('hidden');
      document.getElementById('signal-form').reset();
      document.getElementById('preview-container').classList.add('hidden');
      compressedPhotoBase64 = null;
    }

    function showToast(txt) {
      const t = document.getElementById('toast');
      t.innerText = txt;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      checkIfEmbedded();
    });
  </script>
</body>
</html>
